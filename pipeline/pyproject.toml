[project]
name = "atlas-pipeline"
version = "0.1.0"
description = "Builds the 3D meshes, MRI volumes and manifest for the nervous-system atlas from open MNI-space atlases and BodyParts3D."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2,<3",
  "scipy>=1.15",
  "nibabel==5.4.2",
  "scikit-image==0.26.0",
  "trimesh[easy]==5.1.0",
  "fast-simplification>=0.1.9",
  "pyyaml>=6",
  "httpx>=0.28",
  "tqdm>=4.66",
  "matplotlib>=3.9",
  "pygltflib==1.16.5",
  "pymupdf>=1.26",
]

[project.optional-dependencies]
icp = ["open3d==0.19.0"]
warp = ["antspyx==0.6.3"]

[project.scripts]
atlas-download = "atlas_pipeline.cli:download"
atlas-volumes = "atlas_pipeline.cli:volumes"
atlas-bp3d-select = "atlas_pipeline.cli:bp3d_select"
atlas-register = "atlas_pipeline.cli:register"
atlas-bp3d-meshes = "atlas_pipeline.cli:bp3d_meshes"
atlas-zanatomy-register = "atlas_pipeline.cli:zanatomy_register"
atlas-zanatomy-midline = "atlas_pipeline.cli:zanatomy_midline"
atlas-zanatomy-meshes = "atlas_pipeline.cli:zanatomy_meshes"
atlas-atlas-meshes = "atlas_pipeline.cli:atlas_meshes"
atlas-venat = "atlas_pipeline.cli:venat"
atlas-brainstem-nav = "atlas_pipeline.cli:brainstem_nav"
atlas-lc-metamask = "atlas_pipeline.cli:lc_metamask"
atlas-aan = "atlas_pipeline.cli:aan"
atlas-labels = "atlas_pipeline.cli:labels"
atlas-derived = "atlas_pipeline.cli:derived"
atlas-pam50 = "atlas_pipeline.cli:pam50"
atlas-manifest = "atlas_pipeline.cli:manifest"
atlas-qa = "atlas_pipeline.cli:qa"
atlas-build = "atlas_pipeline.cli:build_all"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_pipeline"]

        dest: vesselRadius.nii.gz
  - id: venat
    name: "VENAT atlas of the venous brain vasculature"
    group: vessels
    license: CC-BY-4.0
    citation: "Huck J, Wanner Y, Fan AP, Jager AT, Grahl S, Schneider U, Villringer A, Steele CJ, Tardif CL, Bazin PL, Gauthier CJ. High resolution atlas of the venous brain vasculature from 7 T quantitative susceptibility maps. Brain Struct Funct 2019;224(7):2467-2485. doi:10.1007/s00429-019-01919-4 (VENAT, figshare doi:10.6084/m9.figshare.7205960.v4)."
    files:
      - url: https://ndownloader.figshare.com/files/13267316
        dest: VENAT_PartialVolume.nii.gz
      - url: https://ndownloader.figshare.com/files/13267301
        dest: VENAT_diameter.nii.gz
  # ---------------- permissively licensed parcellations (public edition cortex) ----------------
  # Replacements for the two non-commercial parcellations. CerebrA is the Mindboggle-101 DKT labelling
  # non-linearly registered and hand-corrected onto MNI-ICBM152 2009c *Symmetric*; the G-Node dataset page
  # states "License Creative Commons CC0 1.0 Public Domain Dedication". The TemplateFlow mirror of the
  # symmetric template ships the MNI/McGill LICENSE ("Permission to use, copy, modify, and distribute this
  # software and its documentation for any purpose and without fee is hereby granted..."), which is what
  # LICENSE.txt below records for the T1w that comes with it.
  - id: cerebra
    name: "CerebrA: Mindboggle-101 DKT labels registered and hand-corrected on MNI-ICBM152 2009c Symmetric"
    group: public-parcellations
    license: CC0-1.0
    citation: Manera AL, Dadar M, Fonov V, Collins DL. CerebrA, registration and manual label correction of
      Mindboggle-101 atlas for MNI-ICBM152 template. Sci Data 2020;7:237. doi:10.1038/s41597-020-0557-9
      (dataset G-Node doi:10.12751/g-node.be5e62, released under CC0 1.0 Public Domain Dedication; files taken
      from the TemplateFlow mirror tpl-MNI152NLin2009cSym, whose template carries the MNI/McGill licence).
    files:
      - url: !join [*tfsym, tpl-MNI152NLin2009cSym_res-1_atlas-CerebrA_dseg.nii.gz]
      - url: !join [*tfsym, tpl-MNI152NLin2009cSym_atlas-CerebA_dseg.tsv]
      - url: !join [*tfsym, tpl-MNI152NLin2009cSym_res-1_T1w.nii.gz]
      - url: !join [*tfsym, LICENSE]
        dest: LICENSE.txt
  # DKT31 in our own asymmetric space, used to measure how far the symmetric CerebrA labels sit from this grid.
  # Mindboggle-101 states "all data are licensed under a Creative Commons License", linking CC BY 4.0.
  - id: dkt31_2009casym
    name: "Mindboggle DKT31 cortical parcellation resampled to MNI152NLin2009cAsym (2 mm)"
    group: public-parcellations
    license: CC-BY-4.0
    citation: Klein A, Tourville J. 101 labeled brain images and a consistent human cortical labeling protocol.
      Front Neurosci 2012;6:171 (Mindboggle-101 / OASIS-TRT-20, CC BY 4.0); DKT31 labels carried into
      MNI152NLin2009cAsym by TemplateFlow (tpl-MNI152NLin2009cAsym_res-02_desc-DKT31_dseg).
    files:
      - url: !join [*tf, tpl-MNI152NLin2009cAsym_res-02_desc-DKT31_dseg.nii.gz]
      - url: !join [*tf, tpl-MNI152NLin2009cAsym_from-OASISTRT20_mode-image_xfm.mat]
  # Public-edition cerebellar lobules. NOT a download: FastSurfer (Apache-2.0) was run here on the MNI T1w
  # template and the label volume it produced is our own derivative of that template, released under
  # CC BY-SA 4.0 with the tool credited. `generated: true` keeps atlas-download away from the folder so the
  # SOURCE.json written by the run (tool commit, checkpoints, exact commands) is not overwritten.
  - id: fastsurfer_cerebellum
    name: "Cerebellar lobules of the MNI152NLin2009cAsym template, segmented with FastSurfer CerebNet"
    group: public-parcellations
    license: CC-BY-SA-4.0
    generated: true
    citation: Derived here by running FastSurfer v2.5.4 (Deep-MI, Apache-2.0) on the MNI152NLin2009cAsym T1w
      template - FastSurferVINN for the aseg/DKT prior (checkpoints Zenodo doi:10.5281/zenodo.10390573,
      Apache-2.0) then the CerebNet cerebellum module (checkpoints Zenodo doi:10.5281/zenodo.10390742,
      CC BY 4.0). Software - Henschel L, Conjeti S, Estrada S, Diers K, Fischl B, Reuter M. FastSurfer, a fast
      and accurate deep learning based neuroimaging pipeline. NeuroImage 2020;219:117012.
      doi:10.1016/j.neuroimage.2020.117012. Cerebellum module - Faber J, Kugler D, Bahrami E, et al. CerebNet,
      a fast and reliable deep-learning pipeline for detailed cerebellum sub-segmentation. NeuroImage
      2022;264:119703. doi:10.1016/j.neuroimage.2022.119703. The label volume itself is a derivative of the
      MNI template (Fonov et al. 2011) and is released under CC BY-SA 4.0; see
      pipeline/raw/fastsurfer_cerebellum/SOURCE.json for the exact commands.
    # no `files:` at all -- there is nothing to fetch and nothing to lock a sha256 for
  # ---------------- BodyParts3D ----------------
  - id: bodyparts3d
    name: "BodyParts3D anatomical model database"
    group: bp3d
    license: CC-BY-4.0-BodyParts3D
    citation: "Mitsuhashi N et al. BodyParts3D: 3D structure database for anatomical concepts. Nucleic Acids Res 2009."
    files:
      - url: https://dbarchive.biosciencedbc.jp/data/bodyparts3d/LATEST/isa_BP3D_4.0_obj_99.zip
        unzip: true
      - url: https://dbarchive.biosciencedbc.jp/data/bodyparts3d/LATEST/partof_BP3D_4.0_obj_99.zip
        unzip: true
      - url: https://dbarchive.biosciencedbc.jp/data/bodyparts3d/LATEST/isa_element_parts.txt
      - url: https://dbarchive.biosciencedbc.jp/data/bodyparts3d/LATEST/partof_element_parts.txt
      - url: https://dbarchive.biosciencedbc.jp/data/bodyparts3d/LATEST/isa_parts_list_e.txt
      - url: https://dbarchive.biosciencedbc.jp/data/bodyparts3d/LATEST/partof_parts_list_e.txt
      - url: https://dbarchive.biosciencedbc.jp/data/bodyparts3d/LATEST/README_e.html
  # ---------------- optional ----------------
  - id: templateflow_warp
    name: "TemplateFlow MNI152NLin6Asym to MNI152NLin2009cAsym transform"
    group: warp
    license: MNI
    citation: "TemplateFlow composite transform MNI152NLin6Asym -> MNI152NLin2009cAsym."
    files:
      - url: !join [*tf, tpl-MNI152NLin2009cAsym_from-MNI152NLin6Asym_mode-image_xfm.h5]
  - id: zanatomy
    name: "Z-Anatomy open 3D atlas of human anatomy"
    group: zanatomy
    license: CC-BY-SA-4.0
    citation: "Z-Anatomy, an open 3D atlas of human anatomy (BodyParts3D-derived)."
    files:
      - url: https://raw.githubusercontent.com/Z-Anatomy/Models-of-human-anatomy/master/Z-Anatomy.zip
        unzip: true
  # ---------------- spinal cord template ----------------
  - id: pam50
    name: "PAM50 brainstem and spinal cord template"
    group: restricted
    license: PAM50-unlicensed
    citation: "De Leener B, Fonov VS, Collins DL, Callot V, Stikov N, Cohen-Adad J. PAM50: Unbiased multimodal
      template of the brainstem and spinal cord aligned with the ICBM152 space. NeuroImage 2018;165:170-179.
      doi:10.1016/j.neuroimage.2017.10.041 (release r20250730)."
    files:
      - url: https://github.com/spinalcordtoolbox/PAM50/releases/download/r20250730/PAM50-r20250730.zip
        unzip: true
  # ---------------- open spinal cord MRI (public edition) ----------------
  # The PAM50 data carries no licence, so the public edition cannot ship a cord MRI derived from it. This is
  # the replacement: ten T2w scans out of the spine-generic multi-subject public database (NeuroPoly), from
  # which `atlas-spine-generic` builds its own straightened cervical/upper-thoracic cord template.
  #
  # Licence, verified live on 2026-09-06 against the repository itself:
  #   * https://github.com/spine-generic/data-multi-subject/blob/master/LICENSE is the verbatim
  #     "Attribution 4.0 International" Creative Commons legal code (CC BY 4.0);
  #   * dataset_description.json in the same commit says "License": "CC0".
  # Both permit redistribution of derived files; the stricter of the two (CC BY 4.0) is what this pipeline
  # records and attributes, and both files are downloaded here as the evidence.
  #
  # The image files are git-annex objects. `git annex get` is the documented way to fetch them, but the
  # dataset's public Compute Canada / Alliance object store (the `computecanada-public` httpalso remote in the
  # repository's git-annex branch, autoenable=true) serves each annex object over plain HTTPS at
  #   <remote url>/<annex key>
  # so no git-annex install is needed. The key is content-addressed -- SHA256E-s<bytes>--<sha256>.nii.gz -- so
  # the URL itself pins the exact bytes, and sources.lock.yaml re-verifies that sha256 after the download.
  # To fetch them the documented way instead:
  #   git clone https://github.com/spine-generic/data-multi-subject && cd data-multi-subject && git annex init
  #   git annex get sub-balgrist0{1,2,3,4,6} sub-cardiff0{2,4} sub-cmrra0{2,4} sub-geneva01 derivatives/labels
  #
  # Ten healthy controls from four 3 T Siemens Prisma / Prisma-fit sites (Balgrist, Cardiff CUBRIC, CMRR
  # Minnesota, Geneva), all acquired with the same spine-generic T2w protocol (0.8 mm isotropic sagittal SPACE,
  # TR 1.5 s) and all carrying the manually corrected C2-T1 dorsal and ventral rootlet segmentations -- which
  # is what lets the template be labelled with true spinal levels instead of a vertebral-level rule of thumb.
  # None of them is listed under csa_t2 in the dataset's own exclude.yml. Per subject four files: the T2w
  # image, the cord segmentation, the manual intervertebral disc labels and the manual rootlet segmentation.
  - id: spine_generic
    name: "Spinal Cord MRI Public Database (multi-subject), 10 subjects' T2w"
    group: spine-open
    license: CC-BY-4.0
    citation: "Cohen-Adad J, Alonso-Ortiz E, Abramovic M, et al. Generic acquisition protocol for quantitative
      MRI of the spinal cord. Nature Protocols 2021;16:4611-4632. doi:10.1038/s41596-021-00588-0; and
      Cohen-Adad J, Alonso-Ortiz E, Abramovic M, et al. Open-access quantitative MRI data of the spinal cord
      and reproducibility across participants, sites and manufacturers. Scientific Data 2021;8:219.
      doi:10.1038/s41597-021-00941-8 (spine-generic multi-subject database, commit 718cbe8f, CC BY 4.0).
      Rootlet segmentations: Valosek J, Mathieu T, Krejci K et al., manual ground truth shipped in the
      dataset's derivatives/labels."
    files:
      - url: https://raw.githubusercontent.com/spine-generic/data-multi-subject/718cbe8f3f8e8f6d57f89b35c9cfb199c93a20bf/LICENSE
        dest: LICENSE_spine-generic.txt

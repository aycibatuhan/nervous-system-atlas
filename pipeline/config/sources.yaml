  # ---------------- lumbosacral spine MRI (conus, cauda equina, nerve roots) ----------------
  # Fourteen healthy adults scanned at 3 T (Fudan University; ethics FE23166I): a composed WHOLE-SPINE
  # sagittal T2-TSE (0.62 x 0.62 x 3.3 mm, skull base to sacrum, ~820 mm), plus lumbosacral CISS (0.3-0.35 mm
  # in-plane) and DESS that resolve the nerve roots, with 3D Slicer markups of the conus outline, the dura,
  # the L1-S2 ganglia and nerve-root trajectories (LPS scanner mm), MRIQC results and reconstructed models.  The figshare collection carries CC BY 4.0 on every article; the
  # companion Scientific Data paper is CC BY-NC-ND but the data licence is the figshare one.  This is the
  # only openly licensed healthy-volunteer MRI of the whole cord found (2026-09): `atlas-fudan-spine` builds
  # the public edition's cord template below the spine-generic field of view from it, conus included.
  - id: lumbosacral_fudan
    name: "Open-access lumbosacral spine MRI dataset with enhanced spinal nerve root resolution (14 subjects)"
    group: spine-open
    license: CC-BY-4.0
    citation: "Liu J, Zhang W, Zhou Y, Xu L, Chu YH, Jia F. An open-access lumbosacral spine MRI dataset with enhanced spinal nerve root
      structure resolution. Scientific Data 2024;11:1131. doi:10.1038/s41597-024-03919-4 (PMC11480038).
      Data: figshare collection 10.6084/m9.figshare.c.7372564, CC BY 4.0."
    files:
      - url: https://ndownloader.figshare.com/files/48012196
        dest: README
      - url: https://ndownloader.figshare.com/files/48013579
        dest: dataset_description.json
      - url: https://ndownloader.figshare.com/files/48012544
        dest: anatqc.zip
        unzip: true
      - url: https://ndownloader.figshare.com/files/48012541
        dest: markers.zip
        unzip: true
      - url: https://ndownloader.figshare.com/files/48111607
        dest: inter-annotators_variability.xlsx
      - url: https://ndownloader.figshare.com/files/48013288
        dest: rawdata.zip
        unzip: true
  # ---------------- open locus coeruleus mask (public edition) ----------------
  # The Brainstem Navigator LC label may not be redistributed, so the public edition uses the openly
  # licensed Dahl et al. LC "meta mask" instead: a consensus volume of interest aggregated across six
  # previously published LC maps, shared in OSF project sf2ky under that project's CC BY 4.0 licence
  # (verified live: https://api.osf.io/v2/nodes/sf2ky/?embed=license reports "CC-By Attribution 4.0
  # International"). The masks are 364x218x364 at 0.5 mm on the FSL MNI152 box (affine
  # [[-0.5,0,0,90],[0,0.5,0,-126],[0,0,0.5,-72]]) -- the reference brain shipped beside them is FSL's
  # avg152T1 -- so they are treated "nlin6-identity" like every other FSL-box atlas here.
  - id: lc_metamask
    name: "Locus coeruleus meta mask (Dahl et al.)"
    group: brainstem-open
    license: CC-BY-4.0
    citation: "Dahl MJ, Mather M, Werkle-Bergner M, Kennedy BL, Guzman S, Hurth K, Miller CA, Qiao Y, Shi Y,
      Chui HC, Ringman JM. Locus coeruleus integrity is related to tau burden and memory loss in
      autosomal-dominant Alzheimer's disease. Neurobiology of Aging 2022;112:39-54.
      doi:10.1016/j.neurobiolaging.2021.11.006 (locus coeruleus meta mask, OSF https://osf.io/sf2ky/, CC BY 4.0)."
    files:
      - url: https://osf.io/download/k6zyr/
        dest: LCmetaMask_MNI05_s01f_plus50.nii.gz
      - url: https://osf.io/download/tjwbh/
        dest: LCmetaMask_left_MNI05_s01f_plus50.nii.gz
      - url: https://osf.io/download/zcrxe/
        dest: LCmetaMask_right_MNI05_s01f_plus50.nii.gz
  # ---------------- Harvard Ascending Arousal Network atlas (public edition) ----------------
  # Edlow/Kinney (Massachusetts General Hospital), "Harvard Ascending Arousal Network Atlas - Version 2.0",
  # Dryad doi:10.5061/dryad.zw3r228d2, released under CC0 1.0 (verified live against
  # https://datadryad.org/api/v2/datasets/doi%3A10.5061%2Fdryad.zw3r228d2, which reports
  # "license: https://spdx.org/licenses/CC0-1.0.html"). Twenty-five files: one whole-brainstem label volume with
  # a FreeSurfer colour LUT, a README, and per-node ROIs in FSL MNI152 1 mm space for DR, LC, LDTg, MnR, mRt,
  # PAG, PBC, PnO, PTg and VTA (most of them as a midline/bilateral file plus a _L and an _R file).
  #
  # MANUAL, and not by choice: Dryad no longer serves file bytes to a script. /api/v2/files/<id>/download
  # answers 401 "must have current bearer token", and the browser path /downloads/file_stream/<id> is behind an
  # Anubis proof-of-work anti-bot interstitial. Neither is something this pipeline may work around, so the eight
  # lateralised ROIs the atlas needs are listed here with their Dryad download URLs and the sha256 digests Dryad
  # publishes for them (pre-seeded in sources.lock.yaml): download them in a browser from
  # https://datadryad.org/dataset/doi:10.5061/dryad.zw3r228d2, drop them in pipeline/raw/aan_atlas/, and
  # `atlas-download --with brainstem-open` will verify every digest before `atlas-aan` meshes them.
  #
  # Only the nuclei with no open mesh yet are listed: LC already has the Dahl meta mask, and PAG, VTA, DR, MnR
  # and PTg (= the pedunculopontine nucleus) already come from MASSP20, which ships in both editions.
  - id: aan_atlas
    name: "Harvard Ascending Arousal Network Atlas v2.0"
    group: brainstem-open
    license: CC0-1.0
    manual: true
    citation: "Edlow BL, Kinney HC, et al. Harvard Ascending Arousal Network Atlas - Version 2.0. Dryad 2023;
      doi:10.5061/dryad.zw3r228d2 (CC0 1.0). Atlas described in Edlow BL et al. Neuroanatomic connectivity of the
      human ascending arousal network. J Neuropathol Exp Neurol 2012;71(6):531-546."
    files:
      - url: https://datadryad.org/api/v2/files/2419155/download
        dest: AAN_PBC_L_MNI152_1mm_v2p0.nii
      - url: https://datadryad.org/api/v2/files/2419154/download
        dest: AAN_PBC_R_MNI152_1mm_v2p0.nii
      - url: https://datadryad.org/api/v2/files/2419147/download
        dest: AAN_LDTg_L_MNI152_1mm_v2p0.nii
      - url: https://datadryad.org/api/v2/files/2419149/download
        dest: AAN_LDTg_R_MNI152_1mm_v2p0.nii
      - url: https://datadryad.org/api/v2/files/2419160/download
        dest: AAN_PnO_L_MNI152_1mm_v2p0.nii
      - url: https://datadryad.org/api/v2/files/2419159/download
        dest: AAN_PnO_R_MNI152_1mm_v2p0.nii
      - url: https://datadryad.org/api/v2/files/2419157/download
        dest: AAN_mRt_L_MNI152_1mm_v2p0.nii

# Every external dataset the pipeline uses. `atlas-download` streams each file into raw/<id>/,
# verifies/records sha256 in sources.lock.yaml, and copies the licence text alongside.
# groups: core (the default: everything the public edition needs), bp3d, tracts, vessels, warp, zanatomy,
#         spine-open, public-parcellations, brainstem-open, terms, and `restricted`.
# `restricted` holds the four datasets whose licence is non-commercial or forbids redistribution
# (harvard_oxford, diedrichsen_cerebellum, pam50, brainstem_navigator). They are NOT downloaded by
# default: they need `atlas-download --with restricted` and belong to the private edition only, which
# is why the public branch's tree guard (scripts/check-tree.ts) fails if one of them is put back into a
# default group. brainstem_navigator additionally needs a manual NITRC download (`manual: true`).
templateflow_base: &tf https://templateflow.s3.amazonaws.com/tpl-MNI152NLin2009cAsym/
templateflow_nlin6: &tf6 https://templateflow.s3.amazonaws.com/tpl-MNI152NLin6Asym/
templateflow_sym: &tfsym https://templateflow.s3.amazonaws.com/tpl-MNI152NLin2009cSym/

licenses:
  MNI:
    name: MNI/McGill template licence (permissive)
    url: https://templateflow.s3.amazonaws.com/tpl-MNI152NLin2009cAsym/LICENSE
    attribution: "MNI152NLin2009cAsym template, (c) Louis Collins, McGill University (Fonov et al. 2011)"
  CC-BY-SA-4.0:
    name: Creative Commons Attribution-ShareAlike 4.0 International
    url: https://creativecommons.org/licenses/by-sa/4.0/
  # BodyParts3D was released under CC BY-SA 2.1 Japan (2009); the LSDB Archive that now serves it relicensed the
  # database to CC BY 4.0 (dbarchive.biosciencedbc.jp/en/bodyparts3d/lic.html, "last updated 2025/02/27"), with
  # the attribution wording below.  Z-Anatomy still names the 2.1 JP licence for the BodyParts3D it started from;
  # that chain holds too, because CC BY-SA 2.1 JP article 5(2) lets adaptations be released under "a newer
  # version of this License", and CC lists every BY-SA 2.0+ port as compatible with BY-SA 4.0.  See
  # pipeline/raw/bodyparts3d/LICENCE_VERIFICATION.txt.
  CC-BY-4.0-BodyParts3D:
    name: Creative Commons Attribution 4.0 International
    url: https://creativecommons.org/licenses/by/4.0/
    attribution: "BodyParts3D, (c) The Database Center for Life Science licensed under CC Attribution 4.0 International"
  CC-BY-4.0:
    name: Creative Commons Attribution 4.0 International
    url: https://creativecommons.org/licenses/by/4.0/
  CC0-1.0:
    name: CC0 1.0 Universal (public domain dedication)
    url: https://creativecommons.org/publicdomain/zero/1.0/

  # Three atlases that TemplateFlow distributes inside tpl-MNI152NLin2009cAsym/ used to be filed under the MNI
  # licence below, because that is the only LICENSE file in that directory.  They are not the template, and that
  # licence is Collins's grant for "this software" -- so it was crediting the wrong people for 112 meshes.  The
  # real terms, checked 2026-09-09:
  #   * MIAL thalamic nuclei -- TemplateFlow ships a sidecar for it, tpl-MNI152NLin2009cAsym_atlas-
  #     MIAL67ThalamicNuclei_dseg.json, which states "License": "CC-BY-4", so it now uses CC-BY-4.0.
  #   * MASSP -- the atlas priors are Bazin's own FigShare deposit doi:10.21942/uva.12074175 ("MASSP structures
  #     prior"), released under Apache 2.0.  Apache adds two conditions CC does not: keep the licence and the
  #     copyright notice, and state that changes were made.  Both hold here -- the text ships in
  #     public/data/licenses/, and every mesh records its construction in the manifest.
  #   * FreeSurfer aseg -- nobody upstream states a licence.  There is no sidecar and no CHANGES entry, and the
  #     file is a derivative of two things at once: the template image and FreeSurfer's own atlas priors.  The
  #     FreeSurfer licence grants use, derivative works and redistribution and says nothing about outputs, so
  #     the segmentation is not encumbered -- but the honest label is not "(c) Louis Collins".
  Apache-2.0:
    name: Apache License 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
    attribution: "MASSP structures prior, (c) Pierre-Louis Bazin, University of Amsterdam (doi:10.21942/uva.12074175),
      Apache License 2.0. The meshes derived from it here are modified: the parcellation was read on the
      MNI152NLin2009cAsym grid, meshed by signed-distance field, smoothed, decimated and welded as the manifest
      records per mesh."

  MNI-FreeSurfer:
    name: MNI/McGill template licence; the labels are a FreeSurfer segmentation for which no licence is stated
    url: https://templateflow.s3.amazonaws.com/tpl-MNI152NLin2009cAsym/LICENSE
    attribution: "FreeSurfer aseg segmentation of the MNI152NLin2009cAsym template, distributed by TemplateFlow,
      which states no separate licence for this file. Template (c) Louis Collins, McGill University (Fonov et al.
      2011); the segmentation was produced with FreeSurfer (Fischl et al. 2002), whose licence permits use,
      derivative works and redistribution and is silent on the outputs of running it."
  # Terminology sources (Turkish edition).  FIPAT publishes its terminologies as PDFs under CC BY-ND 4.0 and states in
  # the front matter that "the individual terms in this terminology are within the public domain"; the atlas uses only
  # the terms (Latin and English names, term numbers) and never redistributes the PDFs.
  FIPAT-terms:
    name: FIPAT terminology terms (public domain; the PDF files are CC BY-ND 4.0 and are not redistributed)
    url: https://creativecommons.org/licenses/by-nd/4.0/
    attribution: "Terms from Terminologia Anatomica, 2nd edition (2019) and Terminologia Neuroanatomica (2017), FIPAT -
      the Federative International Programme for Anatomical Terminology, IFAA; the terms are public domain"
  CC-BY-SA-4.0-Wikipedia:
    name: Creative Commons Attribution-ShareAlike 4.0 International (Wikipedia)
    url: https://creativecommons.org/licenses/by-sa/4.0/
    attribution: "Turkish Wikipedia (Vikipedi) contributors, https://tr.wikipedia.org/ - article titles and redirects
      used as Turkish search synonyms"
  FSL-NC:
    name: Harvard-Oxford atlas (FSL, non-commercial)
    url: https://fsl.fmrib.ox.ac.uk/fsl/fslwiki/Atlases
    nc: true
  CC-BY-NC-3.0:
    name: Creative Commons Attribution-NonCommercial 3.0 (Diedrichsen cerebellar atlas)
    url: https://creativecommons.org/licenses/by-nc/3.0/
    nc: true

  PAM50-unlicensed:
    name: PAM50 template and atlas (no licence file is shipped with the data)
    url: https://github.com/spinalcordtoolbox/PAM50
    attribution: "PAM50 template, De Leener B et al. NeuroImage 2018; the PAM50 data repository carries no LICENSE
      file and states no licence, so derived files are treated as research-use-only and are not redistributed"
    nc: true
    no_redistribution: true

  BrainstemNavigator-NC-ND:
    name: Brainstem Navigator licence (non-commercial research, NO redistribution of derived files)
    url: https://www.nitrc.org/projects/brainstemnavig/
    attribution: "Brainstem Navigator v1.0, Bianciardi lab (Massachusetts General Hospital); research use only, derived files must not leave the organisation"
    nc: true
    no_redistribution: true

sources:

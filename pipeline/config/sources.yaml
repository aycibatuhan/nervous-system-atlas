  # ---------------- terminology (Turkish edition) ----------------
  # Not meshes or volumes: the Latin structure names and Turkish search synonyms in content/data/ come from these,
  # through tools/i18n/terms.py (fetch / table / apply).  `api` sources are queried live and cached under
  # reference/terms/; nothing from them is downloaded by atlas-download.
  - id: fipat_ta2
    name: "Terminologia Anatomica, 2nd edition (FIPAT, 2019), parts 1-5"
    group: terms
    license: FIPAT-terms
    citation: "FIPAT. Terminologia Anatomica, 2nd edition (TA2, version 2.07). Federative International Programme for
      Anatomical Terminology, 2019. https://fipat.library.dal.ca/ta2/"
    files:

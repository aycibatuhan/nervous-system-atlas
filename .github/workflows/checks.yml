# Continuous checks for the Clinical Neuroanatomy Atlas.
#
# WHAT CI CAN AND CANNOT DO HERE
#
# The app's data — public/data/ (meshes, MRI volumes, label tables, manifest.json)
# — is generated by the Python pipeline from downloaded source atlases and is
# gitignored, so a CI checkout does not have it. Neither is the private text
# corpus under reference/, nor pipeline/raw/ or pipeline/work/. Every check below
# was verified to pass in a fresh `git clone` + `npm ci` with no generated data;
# the ones that need the data are listed at the bottom of this file and must be
# run locally before a release. CI is therefore a subset of the suite in
# README.md ("Checks") — a green run here does not mean the atlas builds.

name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

# A new push to the same branch or PR supersedes the run in flight.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the local toolchain (node 22.x); package.json depends on
          # @types/node ^22.
          node-version: '22'
          cache: 'npm'

      # `npm ci` rather than `npm install`: the lockfile is committed and must
      # be honoured exactly. It also installs the devDependencies that
      # `npm run notice -- --check` reads licences from.
      - name: install
        run: npm ci

      # ---------------------------------------------------------------------
      # The redistribution gate comes first: it is the check whose failure is
      # most expensive to discover late. scripts/check-tree.ts fails if a
      # restricted source dataset, a private path (source/, reference/) or a
      # generated data blob has been committed.
      #
      # It also fails on the public branch if a restricted dataset has been put
      # back into a default `atlas-download` group, which would make a plain
      # pipeline run build data that may not be redistributed.
      - name: repo tree guard (public/private data must not be committed)
        run: npm run check-tree

      - name: typecheck
        run: npm run typecheck

      # The whole suite runs here. The three files that need generated data
      # (public-edition, spine-lut, content) skip themselves when it is absent,
      # so a data-less checkout reports 6 passed / 2 skipped rather than
      # failing — but note that the skipped ones include half of the
      # redistribution guarantee (public-edition.test.ts re-implements the
      # exclusion rule and asserts it against the real private manifest), so
      # they must still be run locally before a release.
      - name: unit tests
        run: npm test

      # Schemas, cross-links, word minimums, American spelling, coverage.
      # The 11-word-shingle plagiarism check inside this build is skipped
      # automatically because reference/ is absent; the run prints
      # "plagiarism skipped".
      - name: content validation
        run: npm run content:validate

      # Every citation is a well-formed ref into content/bibliography/, every
      # bibliography entry is verified and is cited by something.
      - name: citations
        run: npm run citations:check

      # NOTICE is generated from pipeline/config/sources.yaml + package.json and
      # must never be edited by hand; this fails if it is stale.
      - name: NOTICE is up to date
        run: npm run notice -- --check

      # `npm run build` is the public edition: content bundle, vite, then the
      # filter and the redistribution gate. With no public/data/ in a clone
      # there is nothing to filter or gate, so it stops after the app bundle and
      # says so — which still proves the app compiles and that the content build
      # can produce content.json, search-index.json and content.tr.json (the
      # Turkish overlays are applied here).
      - name: build (content bundle + vite)
        run: npm run build

  translations:
    name: turkish translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tools/i18n/prose.py is pure standard library, so it needs neither uv nor
      # the pipeline's dependencies (numpy, nibabel, trimesh…) — and the
      # pipeline venv could not be built here anyway without its raw data.
      # 3.12 is the pipeline's floor (`requires-python = ">=3.12,<3.13"`);
      # prose.py itself is happy on anything from 3.12 up.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Checks every content/i18n/tr/<kind>/<id>.json overlay against its
      # English entry in content/: missing or unknown field paths, a `source`
      # hash that no longer matches the English strings (a stale translation),
      # lost cross-links, numbers that differ. Reads only content/ and tools/.
      #
      # Note the direction of the dependency: editing an English entry
      # invalidates its Turkish overlay, so a content-only pull request can fail
      # HERE and nowhere else.
      - name: turkish overlays check
        run: python3 tools/i18n/prose.py check

      # Not a gate — prints per-kind coverage into the log so a reviewer can see
      # what a content change did to the translation backlog.
      - name: turkish coverage
        run: python3 tools/i18n/prose.py status

# ---------------------------------------------------------------------------
# NOT RUNNABLE IN CI WITHOUT public/data/ — run these locally before a release.
# (Verified by probing a fresh clone; the reason each one fails is given.)
#
#   node scripts/check-data.ts
#       "missing manifest public/data/manifest.json" — integrity check over the
#       generated meshes, volumes and manifest.
#
#   the data half of `npm run build`, and `npm run check-public`
#       with no public/data/ the build stops after the app bundle: there is no
#       manifest to filter dist/data against and check-public would report
#       "dist has no data/". Run over a real build, this is the redistribution
#       gate and the single most important check before publishing anything.
#
#   npm run build:private   /   npm run content:private
#       the full edition; they need manifest.private.json, which only exists on
#       a machine that has built the restricted data.
#
#   npx playwright install chromium && npm run e2e
#       all 15 smoke tests fail. They boot the app against `npm run dev` and
#       wait for the manifest to load; with no public/data/ the dev server
#       answers /data/manifest.json with the SPA index.html fallback, the atlas
#       never sets loaded.manifest, and every test times out in boot().
#
#   uv run --project pipeline atlas-qa
#       the pipeline's own data gates (registration residuals, mesh budgets);
#       needs pipeline/work/ and the downloaded source atlases.
#
#   the plagiarism check inside `npm run content:validate`
#       skipped automatically here, because it needs the private corpus under
#       reference/. It runs locally whenever reference/ exists.
